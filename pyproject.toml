[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botspotter"
version = "0.1.0"
description = "Every AI bot on the internet, counted and named."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "orjson>=3.9",
    "redis>=5.0",
    "asyncpg>=0.29",
    "aiokafka>=0.10",
    "pydantic>=2.5",
    "maxminddb>=2.5",
    "dnspython>=2.6",
]

[project.optional-dependencies]
demo = ["fakeredis>=2.21"]
docs = ["sphinx>=7", "furo>=2024.1", "sphinx-autodoc-typehints>=2", "sphinx-copybutton>=0.5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "granian>=1.4",
]

[project.scripts]
botspotter-ingest = "botspotter.ingest.app:main"
botspotter-api = "botspotter.api.app:main"
botspotter-aggregator = "botspotter.aggregator.run:main"

[tool.setuptools.packages.find]
include = ["botspotter*"]

[tool.setuptools.package-data]
"botspotter.data" = ["*.json", "*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
