# Failure alarm for main: when ci or deploy fails on main (i.e. after a merge), open an
# issue assigned to the owner (= email + GitHub notification) with: what failed, the
# last known good SHA, a one-click rollback link, and the ask for a new MR with the fix.
# Install: cp deploy/github/workflows/alarm.yml .github/workflows/alarm.yml
name: alarm
on:
  workflow_run:
    workflows: [ci, deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  alarm:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner, repo = context.repo.repo;
            // last successful deploy on main = last known good revision
            const ok = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'deploy.yml', branch: 'main', status: 'success', per_page: 1 });
            const good = ok.data.workflow_runs[0]?.head_sha || '(none recorded — see git log)';
            const rollbackUrl = `https://github.com/${owner}/${repo}/actions/workflows/rollback.yml`;
            const title = `🚨 ${run.name} failed on main @ ${run.head_sha.slice(0,8)} — ${run.head_commit?.message?.split('\n')[0] || ''}`;
            const body = [
              `**${run.name}** failed on \`main\` after merge of \`${run.head_sha.slice(0,8)}\` (${run.head_commit?.message?.split('\n')[0] || ''}).`,
              ``, `- Failed run: ${run.html_url}`,
              `- Last known good deploy: \`${good}\``,
              run.name === 'deploy' ? `- The VM auto-rolls back to the previous revision when health/smoke fail (deploy/remote.sh). Verify: https://botspotter.app/healthz` : `- Nothing was deployed (ci failed before deploy).`,
              ``, `### Your options`,
              `1. **Roll back now**: ${rollbackUrl} → Run workflow → rev = \`${good}\` → approve the production deployment.`,
              `2. **Fix forward**: open a new MR from a feature branch with the fix; the gate and ci must pass, then review/approve as usual.`,
              ``, `_Opened automatically by .github/workflows/alarm.yml; assigned to the owner for notification._`
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'incident', per_page: 20 });
            const dup = existing.data.find(i => i.title.includes(run.head_sha.slice(0,8)) && i.title.startsWith(`🚨 ${run.name}`));
            if (dup) { await github.rest.issues.createComment({ owner, repo, issue_number: dup.number, body: `Failed again: ${run.html_url}` }); return; }
            try { await github.rest.issues.createLabel({ owner, repo, name: 'incident', color: 'b60205' }); } catch (e) {}
            await github.rest.issues.create({ owner, repo, title, body, labels: ['incident'], assignees: [owner] });
