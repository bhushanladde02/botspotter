# Put inside the `http {}` block of nginx.conf, then in each server {}:
#   access_log /var/log/nginx/botspotter.log botspotter;
#
# Only header NAMES are logged (not values), plus UA, IP, country, method,
# status and whether the path was robots.txt. Nothing else leaves the box.

map $request_uri $bs_path { default ""; "~*robots\.txt" "/robots.txt"; }

# Nginx can't enumerate request headers natively; this is the common set.
# Each $http_* that is present contributes its name; absent ones are blank
# and stripped by Vector's split().
map $http_accept           $h_accept           { default ""; "~." "accept"; }
map $http_accept_language  $h_accept_language  { default ""; "~." "accept-language"; }
map $http_accept_encoding  $h_accept_encoding  { default ""; "~." "accept-encoding"; }
map $http_connection       $h_connection       { default ""; "~." "connection"; }
map $http_referer          $h_referer          { default ""; "~." "referer"; }
map $http_cache_control    $h_cache_control    { default ""; "~." "cache-control"; }
map $http_upgrade_insecure_requests $h_uir     { default ""; "~." "upgrade-insecure-requests"; }
map $http_sec_fetch_mode   $h_sec_fetch_mode   { default ""; "~." "sec-fetch-mode"; }
map $http_from             $h_from             { default ""; "~." "from"; }

log_format botspotter escape=json
  '{"time":"$time_local","ua":"$http_user_agent","ip":"$remote_addr",'
  '"cf_country":"$http_cf_ipcountry","method":"$request_method","status":"$status",'
  '"path":"$bs_path",'
  '"headers":"host,user-agent,$h_accept,$h_accept_language,$h_accept_encoding,$h_connection,$h_referer,$h_cache_control,$h_uir,$h_sec_fetch_mode,$h_from"}';
