[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botspotter-sensor"
version = "0.1.0"
description = "Report AI bot visits from your Python web app to BotSpotter. Zero dependencies."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["botspotter_sensor*"]
