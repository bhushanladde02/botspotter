# BotSpotter — full stack on one Oracle Always-Free VM (2 OCPU / 12 GB).
# Memory limits below are the free-tier budget from docs/free-tier.md.
#
#   cp .env.example .env   (edit secrets)
#   docker compose up -d --build
#   open http://<vm-ip>/
#
# Scale ingest later with:  docker compose up -d --scale ingest=3

x-app: &app
  build: .
  image: botspotter:local
  env_file: .env
  environment:
    BS_STREAM: redpanda
    BS_STORE: postgres
    BS_REDIS_URL: redis://redis:6379/0
    BS_KAFKA_BOOTSTRAP: redpanda:9092
    BS_PG_DSN: postgresql://botspotter:${PG_PASSWORD:-botspotter}@postgres:5432/botspotter
  restart: unless-stopped
  depends_on:
    redis: { condition: service_healthy }
    redpanda: { condition: service_healthy }
    postgres: { condition: service_healthy }

services:
  edge:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, ingest]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  ingest:
    <<: *app
    command: ["granian", "--interface", "asgi", "--host", "0.0.0.0", "--port", "8001",
              "--workers", "2", "--loop", "uvloop", "botspotter.ingest.app:app"]
    expose: ["8001"]
    deploy: { resources: { limits: { memory: 256M } } }

  api:
    <<: *app
    command: ["granian", "--interface", "asgi", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "1", "--loop", "uvloop", "botspotter.api.app:app"]
    expose: ["8000"]
    deploy: { resources: { limits: { memory: 256M } } }

  aggregator:
    <<: *app
    command: ["botspotter-aggregator"]
    deploy: { resources: { limits: { memory: 256M } } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction",
              "--save", "60", "1000", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 320M } } }

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --set redpanda.auto_create_topics_enabled=true
      - --set redpanda.log_retention_ms=604800000
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck: { test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 10s, timeout: 5s, retries: 12 }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1280M } } }

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: botspotter
      POSTGRES_USER: botspotter
      POSTGRES_PASSWORD: ${PG_PASSWORD:-botspotter}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=40",
              "-c", "timescaledb.max_background_workers=4"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U botspotter"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1024M } } }

volumes:
  redis-data:
  redpanda-data:
  pg-data:
