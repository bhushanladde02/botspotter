# Freshness watchdog: every 15 min, check that the live snapshot is fresh. The aggregator
# rewrites it every few seconds even with no traffic, so an old snapshot means counting has
# stopped (2026-11-12: a crash loop went unnoticed for 9.7 h; 2026-10-26: 10.6 h).
# Stale or unreachable -> open ONE issue labelled `incident`, assigned to the owner (= email).
# Fresh again -> comment and close it.
# Install: cp deploy/github/workflows/watchdog.yml .github/workflows/watchdog.yml
# Note: GitHub pauses scheduled workflows after 60 days without repo activity; re-enable in Actions.
name: watchdog
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        env:
          URL: https://botspotter.app/v1/snapshot
          MAX_AGE_S: "600"
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const maxAge = Number(process.env.MAX_AGE_S);
            let problem = null, age = null;
            try {
              const r = await fetch(process.env.URL, { headers: { 'User-Agent': 'BotSpotter-Watchdog/1.0 (+github actions)' } });
              if (!r.ok) problem = `snapshot endpoint answered HTTP ${r.status}`;
              else {
                const s = await r.json();
                age = Math.round(Date.now() / 1000 - Number(s.ts));
                if (!(age >= -60 && age <= maxAge)) problem = `snapshot is ${age}s old (limit ${maxAge}s): the aggregator has stopped counting`;
              }
            } catch (e) { problem = `site unreachable: ${e.message}`; }
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'incident,watchdog', per_page: 10 })).data;
            if (!problem) {
              core.info(`fresh: snapshot age ${age}s`);
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `Recovered: snapshot age ${age}s at ${new Date().toISOString()}.` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
              return;
            }
            core.warning(problem);
            if (open.length) { core.info(`already open: #${open[0].number}`); return; }
            const body = [
              `**${problem}** (checked ${new Date().toISOString()}).`, ``,
              `### Look first (read-only)`,
              '```bash',
              `ssh -i ~/.ssh/sharpen_vm ubuntu@129.213.153.181 'cd ~/botspotter && docker compose ps && docker compose logs --tail 60 aggregator'`,
              '```',
              `- Aggregator restarting in a loop? Stop it (\`docker compose stop aggregator\`) — events queue safely in Redpanda — and read the traceback. A crash after counting re-applies the batch on every restart (capped at 3 since 2026-11-12, see docs/operations-log.rst).`,
              `- Counters inflated? \`python -m botspotter.repair\` (dry run first) — see docs/runbook.rst "Repair inflated counters". Never wipe Redis.`,
              ``, `_Opened by .github/workflows/watchdog.yml; closes itself when the snapshot is fresh again._`
            ].join('\n');
            const issue = await github.rest.issues.create({ owner, repo, title: `🚨 BotSpotter stopped counting — ${problem.split(':')[0]}`, body, labels: ['incident', 'watchdog'], assignees: [owner] });
            core.setFailed(`opened #${issue.data.number}: ${problem}`);
