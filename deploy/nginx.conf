# Edge: one origin for the portal, the read API and the ingest endpoints.
# Cloudflare sits in front of this in production (TLS, DDoS, caching,
# rate limit on /v1/ingest). This config is Cloudflare-agnostic.

proxy_cache_path /tmp/ngx_cache levels=1 keys_zone=snap:5m max_size=50m inactive=60s use_temp_path=off;

upstream api     { server api:8000;    keepalive 32; }
upstream ingest  { server ingest:8001; keepalive 32; }

# Local rate limit as a backstop behind Cloudflare's.
limit_req_zone $binary_remote_addr zone=ingest:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=beacon:10m rate=2r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Forward the real client IP + country whether or not Cloudflare is in front.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /v1/ingest { limit_req zone=ingest burst=60 nodelay; proxy_pass http://ingest; }
    location = /v1/beacon { limit_req zone=beacon burst=5 nodelay;  proxy_pass http://ingest; }
    location /            { proxy_pass http://api; }

    # Tiny shared cache so even without Cloudflare 10k viewers = 1 origin hit / 2s.
    location = /v1/snapshot {
        proxy_cache snap; proxy_cache_valid 200 2s; proxy_cache_use_stale updating error timeout;
        proxy_cache_lock on; add_header X-Cache $upstream_cache_status;
        proxy_pass http://api;
    }
    location = /v1/map {
        proxy_cache snap; proxy_cache_valid 200 5s; proxy_cache_use_stale updating error timeout;
        proxy_cache_lock on; proxy_cache_key "$request_uri"; proxy_pass http://api;
    }
}
