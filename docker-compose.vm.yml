# Overlay for the shared Oracle A1 VM (1 OCPU / 6 GB, Sharpen already on it).
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --build
#
# Differences from the base file:
#   - no `edge` (Sharpen's Caddy owns :80/:443 and proxies botspotter.app to us)
#   - api + ingest also join Caddy's docker network (CADDY_NETWORK in .env)
#   - memory/worker trims for a 1-OCPU box shared with another app
services:
  edge:
    profiles: ["disabled"]

  ingest:
    command: ["granian", "--interface", "asgi", "--host", "0.0.0.0", "--port", "8001",
              "--workers", "1", "--loop", "uvloop", "botspotter.ingest.app:app"]
    volumes: ["${DATA_DIR:-/home/ubuntu/botspotter-data}:/data:ro"]
    environment: { BS_GEOIP_DB: /data/GeoLite2-City.mmdb, BS_GEOIP_ASN_DB: /data/GeoLite2-ASN.mmdb, BS_RUNTIME_DIR: /data }
    networks:
      default: {}
      web: { aliases: [bs-ingest] }
    deploy: { resources: { limits: { memory: 192M } } }

  api:
    volumes: ["${DATA_DIR:-/home/ubuntu/botspotter-data}:/data:ro"]
    environment: { BS_GEOIP_DB: /data/GeoLite2-City.mmdb, BS_GEOIP_ASN_DB: /data/GeoLite2-ASN.mmdb, BS_RUNTIME_DIR: /data }
    networks:
      default: {}
      web: { aliases: [bs-api] }
    deploy: { resources: { limits: { memory: 192M } } }

  aggregator:
    volumes: ["${DATA_DIR:-/home/ubuntu/botspotter-data}:/data:ro"]
    environment: { BS_RUNTIME_DIR: /data }
    deploy: { resources: { limits: { memory: 192M } } }

  # Sensor for sharpenscore.com (same VM, same Caddy): Caddy logs over TCP -> Vector -> ingest.
  # Caddy side: a `log { output net tcp/bs-vector:9000 { soft_start } format json }` block
  # in the sharpenscore.com site (docs/sensors.rst "Caddy sidecar"). SHARPEN_SENSOR_KEY is derived
  # from BS_SENSOR_KEYS by deploy/remote.sh.
  sensor-vector:
    image: timberio/vector:0.42.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    volumes: ["./sensors/caddy/vector.toml:/etc/vector/vector.toml:ro"]
    environment:
      BS_KEY: ${SHARPEN_SENSOR_KEY:-}
      BS_HOST: sharpenscore.com   # Vector forwards only lines whose Host contains this; the site is sharpenscore.com, not sharpen.com
      BS_ENDPOINT: http://ingest:8001/v1/ingest
      VECTOR_LOG: warn
    depends_on: [ingest]
    networks:
      default: {}
      web: { aliases: [bs-vector] }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 96M } } }

  redis:
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction",
              "--save", "60", "1000", "--appendonly", "yes"]
    deploy: { resources: { limits: { memory: 256M } } }

  redpanda:
    command:
      - redpanda start
      - --smp 1
      - --memory 640M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --set redpanda.auto_create_topics_enabled=true
      - --set redpanda.log_retention_ms=604800000
    deploy: { resources: { limits: { memory: 896M } } }

  postgres:
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30",
              "-c", "timescaledb.max_background_workers=2"]
    deploy: { resources: { limits: { memory: 640M } } }

networks:
  web:
    external: true
    name: ${CADDY_NETWORK:-deploy_default}
